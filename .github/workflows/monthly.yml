# Rebuild the plate from live sources once a month and fail when anything
# upstream moved: a new ISO 15924 code (build_data.py stops on a script with no
# genealogy row), a broken acceptance check (verify.py), or any figure that
# differs from the committed dataset (drift.py). The plate prints its retrieval
# date, so the failure this catches is staleness, not a false claim.
name: monthly rebuild

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools uharfbuzz brotli
      - run: python fetch.py
      - run: python fetch_wikidata.py
      - run: python fonts.py
      - run: python build_data.py
      - run: python render.py
      - run: python verify.py
      - run: python drift.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plate
          path: |
            out/descent_of_writing.svg
            out/scripts_catalogue.csv
            out/dataset.json
